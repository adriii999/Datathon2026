dataset:
  version: "v1.0.0-F2"
  srid: 25830
  seed: 2026
  spatial_buffer_km: 25.0

# Las listas `features` son documentales: la fuente canónica es FEATURES_M1 /
# FEATURES_M4 en cada `train.py`, y cualquier cambio debe reflejarse también en
# el metadata de `oracle/ddl/05-modelos_onnx.sql`.
models:
  m1_avm:
    algorithm: "RandomForestRegressor"
    n_estimators: 100
    max_depth: 5
    min_samples_leaf: 2
    random_state: 2026
    confidence_level: 0.95
    features:
      - tiempo_medio_madrid_minutos
      - densidad
      - cobertura_fibra_pct
      - paradas_x1000
      - vacias_x1000
      - medicos_x1000
      - tasa_holgura_escolar

  m2_indicadores:
    n_components_pca: 1
    scaler_range: [0, 100]
    isochrone_cutoff_min: 30

  m3_demografia:
    horizons_years: [5, 10]
    stress_scenarios_pct: [0.0, 5.0, 10.0]
    confidence_level: 0.95

  m4_capacidad:
    algorithm: "GradientBoostingRegressor"
    n_estimators: 120
    learning_rate: 0.05
    max_depth: 3
    random_state: 2026
    confidence_level: 0.95
    features:
      - score_sanidad
      - score_educacion
      - score_conectividad
      - score_vivienda
      - hab_por_medico
      - ocupacion_escolar_pct
      - stock_vivienda_vacia_est
      - suelo_urbano_disponible_m2

  m5_recomendador:
    n_clusters: 4
    random_state: 2026
    similarity_metric: "weighted_cosine"
